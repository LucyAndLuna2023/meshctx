<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang-key="meta_title">🧪 Test Report</title>
<style>
body{font-family:-apple-system,monospace;background:#0f172a;color:#e2e8f0;padding:20px;max-width:1200px;margin:auto}
h1{color:#38bdf8}
.pass{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}
table{width:100%;border-collapse:collapse;margin:10px 0}
th,td{border:1px solid #334155;padding:8px;text-align:left}
th{background:#1e293b}
tr:hover{background:#1e293b}
.summary{display:flex;gap:20px;margin:20px 0}
.card{background:#1e293b;padding:16px;border-radius:8px;flex:1;text-align:center}
.card .num{font-size:2em;font-weight:bold}
.refresh{color:#94a3b8;font-size:12px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lang-select{background:#1e293b;color:#e2e8f0;border:1px solid #38bdf8;padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer}
.lang-select:hover{background:#334155}
</style>
</head>
<body>
<h1 data-lang-key="meta_title">🧪 Test Report</h1>
<div class="top-bar">
  <div class="refresh"><span data-lang-key="refresh_label">Auto-refresh every 30s</span> | <span id="time"></span></div>
  <select class="lang-select" onchange="switchLang(this.value)">
    <option value="en" data-lang-key="opt_en">English</option>
    <option value="zh" data-lang-key="opt_zh">中文</option>
    <option value="fr" data-lang-key="opt_fr">Français</option>
    <option value="de" data-lang-key="opt_de">Deutsch</option>
    <option value="ja" data-lang-key="opt_ja">日本語</option>
    <option value="ko" data-lang-key="opt_ko">한국어</option>
    <option value="es" data-lang-key="opt_es">Español</option>
  </select>
</div>

<div class="summary">
  <div class="card"><div class="num pass" id="passed">-</div><span data-lang-key="col_passed">Passed</span></div>
  <div class="card"><div class="num fail" id="failed">-</div><span data-lang-key="col_failed">Failed</span></div>
  <div class="card"><div class="num warn" id="total">-</div><span data-lang-key="col_total">Total</span></div>
</div>

<h2 data-lang-key="results_title">Test Results</h2>
<table>
<thead><tr><th data-lang-key="th_num">#</th><th data-lang-key="th_test">Test</th><th data-lang-key="th_status">Status</th><th data-lang-key="th_detail">Detail</th></tr></thead>
<tbody id="results"></tbody>
</table>

    },

function switchLang(lang) {
    document.querySelectorAll("[data-lang-key]").forEach(function(el) {
        var key = el.dataset.langKey;
        if (L[lang] && L[lang][key]) el.textContent = L[lang][key];
    });
    document.title = L[lang] ? (L[lang].meta_title || document.title) : document.title;
    var root = document.getElementById("html-root");
    if (root) root.setAttribute("lang", lang);
    localStorage.setItem("meshctx-lang", lang);
    var sel2 = document.querySelector(".lang-select");
    if (sel2) sel2.value = lang;
}

(function(){
    var bl = (navigator.language||navigator.userLanguage||"").slice(0,2).toLowerCase();
    var supported = ["zh","ja","ko","es","fr","de"];
    var saved = localStorage.getItem("meshctx-lang");
    var lang = saved || (supported.indexOf(bl) >= 0 ? bl : "en");
    switchLang(lang);
    var sel = document.querySelector(".lang-select");
    if (sel) sel.value = lang;
})();

async function load() {
  try {
    const r = await fetch("/api/test-report");
    const data = await r.json();
    document.getElementById("passed").textContent = data.passed;
    document.getElementById("failed").textContent = data.failed;
    document.getElementById("total").textContent = data.total;
    document.getElementById("time").textContent = new Date().toLocaleTimeString();

    const tbody = document.getElementById("results");
    tbody.innerHTML = data.tests.map(function(t,i) {
      return "<tr><td>" + (i+1) + "</td><td>" + t.name + "</td><td class=\"" + t.status.toLowerCase() + "\">" + t.status + "</td><td>" + (t.detail||"") + "</td></tr>";
    }).join("");
  } catch(e) {
    var lang = localStorage.getItem("meshctx-lang") || "en";
    var msg = (L[lang] && L[lang].error_msg) ? L[lang].error_msg : "Server not running";
    document.getElementById("results").innerHTML = "<tr><td colspan=\"4\">" + msg + "</td></tr>";
  }
}
load();
setInterval(load, 30000);
