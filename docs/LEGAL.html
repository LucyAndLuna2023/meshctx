<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshCtx Legal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e1a;--bg2:#1a1f35;--fg:#e0e4f0;--muted:#8090b0;--purple:#6c5ce7;--cyan:#00cec9;--green:#00b894;--border:rgba(255,255,255,0.08);--card-bg:rgba(255,255,255,0.03)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0b0e1a,#1a1f35);color:var(--fg);min-height:100vh;line-height:1.7}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(11,14,26,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-bar a{color:#a78bfa;text-decoration:none;font-size:.9rem}.top-bar a:hover{color:#6c5ce7}
.lang-select{background:var(--bg2);color:var(--fg);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.85rem}
.lang-select:hover{border-color:var(--purple)}.lang-select option{background:var(--bg2);color:var(--fg)}
.container{max-width:900px;margin:0 auto;padding:80px 24px 48px}
h1{font-size:2.2em;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:var(--muted);margin-bottom:40px}
h2{font-size:1.3em;color:#a78bfa;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h4{color:var(--cyan);margin-bottom:12px}
.card table{width:100%;border-collapse:collapse;font-size:.85rem;margin:12px 0}
.card th,.card td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.card th{color:var(--muted);font-weight:500}
ul,ol{padding-left:24px;margin:12px 0}
ul li,ol li{margin:6px 0;color:#c4c8e0}
p{margin:12px 0;color:#c4c8e0}
a{color:var(--purple);text-decoration:none}a:hover{color:var(--cyan)}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.contact-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.contact-item strong{color:var(--cyan);display:block;margin-bottom:8px}
footer{text-align:center;padding:40px 24px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:40px}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" data-lang-key="nav_home">← Home</a>
  <select class="lang-select" onchange="switchLang(this.value)">
    <option value="en">English</option>
    <option value="zh">简体中文</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="es">Español</option>
  </select>
</div>

<div class="container">

  <section><h2 data-lang-key="section2_title">2. Disclaimer</h2><div data-lang-key="legal_disclaimer_text"></div></section>
  <section><h2 data-lang-key="section3_title">3. Intellectual Property</h2><div data-lang-key="legal_ip_text"></div></section>
  <section><h2 data-lang-key="section4_title">4. Terms of Service</h2><div data-lang-key="legal_tos_text"></div></section>
  <section><h2 data-lang-key="section5_title">5. Privacy Policy</h2><div data-lang-key="legal_privacy_text"></div></section>
  <section><h2 data-lang-key="section6_title">6. Contact</h2><div data-lang-key="legal_contact_text"></div></section>
</div>

<footer>
  <p data-lang-key="footer">Last updated: May 14, 2026</p>
  <p data-lang-key="footer_copy">© 2026 MeshCtx. All rights reserved.</p>
</footer>

const HTML_KEYS = new Set(['legal_license_text','legal_disclaimer_text','legal_ip_text','legal_tos_text','legal_privacy_text','legal_contact_text']);

function switchLang(lang) {
  if (!L[lang]) return;
  document.querySelectorAll('[data-lang-key]').forEach(el => {
    const key = el.getAttribute('data-lang-key');
    if (L[lang][key]) {
      if (HTML_KEYS.has(key)) el.innerHTML = L[lang][key];
      else el.textContent = L[lang][key];
    }
  });
  document.title = L[lang].meta_title || 'MeshCtx Legal';
  document.documentElement.lang = lang;
  localStorage.setItem('meshctx-lang', lang);
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('meshctx-lang') || 'en';
  document.querySelector('.lang-select').value = saved;
  switchLang(saved);
});
</script>
</body>
</html>
