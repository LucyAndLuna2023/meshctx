name: CI

on:
  push:
    branches: [main]
    tags: ['v*']  # 002codex: tag 构建不可达 = 发版无 CI 门禁 (v3.133.0 教训)
  pull_request:
    branches: [main]

jobs:
  release-publish:
    # v3.135.12 (002codex 989b678a): 发布时序治本 — 等本 workflow 全绿后 publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, version-gate, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Wait & verify all exact-SHA checks green
        run: |
          pip install requests
          python3 - <<'EOF'
          import requests, sys, os, time
          tok = os.environ["GITHUB_TOKEN"]; sha = os.environ["C_SHA"]
          self_id = int(os.environ["GITHUB_RUN_ID"])  # v3.135.13: 排除自身 — 自等待死锁 (30min 超时实证)
          for _ in range(60):  # 最多等 30 分钟
              runs = requests.get(f"https://api.github.com/repos/LucyAndLuna2023/meshctx/actions/runs",
                  params={"head_sha": sha, "per_page": 50},
                  headers={"Authorization": f"token {tok}"}).json().get("workflow_runs", [])
              runs = [r for r in runs if r["id"] != self_id]  # 排除自身 (publish job 属于该 run)
              active = [r for r in runs if r["status"] != "completed"]
              red = [r for r in runs if r["status"] == "completed" and r["conclusion"] == "failure"]
              if red:
                  print("🔴 exact-SHA workflow failure:", [r["name"] for r in red]); sys.exit(1)
              if not active and len(runs) >= 6:
                  print("🟢 全部 exact-SHA workflow 完成 且 0 failure"); break
              time.sleep(30)
          else:
              print("🔴 等待超时"); sys.exit(1)
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C_SHA: ${{ github.sha }}
      - name: Publish release (draft → public)
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/LucyAndLuna2023/meshctx/releases/tags/${GITHUB_REF_NAME}"             -d '{"draft": false}' | grep -q '"draft":false' || echo "release 可能尚未由 build 创建 (将在 assets 上传后由人工 publish)"

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Release gate (pre-tag checks)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyyaml numpy requests python-multipart aiofiles jinja2 websockets cryptography
          pip install -e .[dev]
          VER=${GITHUB_REF_NAME#v}
          python tools/release_gate.py "$VER"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pyyaml numpy requests python-multipart aiofiles jinja2 websockets cryptography

    - name: Test with pytest (framework only, skip brain)
      run: |
        pip install -e .[dev]  # 002codex: 装齐实际依赖 (httpx/pytest-asyncio 等, 手工清单缺失致环境性红)
        set -o pipefail  # 002codex P1-B: 假绿根修 — pytest rc 被 tail 吞掉, broken code 进 main CI 仍 success
        pytest tests/ -v --tb=short -k "not brain and not super_brain and not healer and not predictor and not orchestrator and not free_energy and not active_inference" \
          --ignore=tests/ui/ --ignore=tests/run_e2e_test.py \
          -o 'addopts=' 2>&1 | tail -30

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t meshctx .

    - name: Test Docker image
      run: |
        docker run -d -p 3001:3001 --name meshctx-test meshctx
        sleep 10
        curl -fs http://localhost:3001/api/version
        docker stop meshctx-test

  # ═══ 发版流程固化 (2026-08-26 004meshctx, 002meshctx/004meshctx 审计建议) ═══
  # 防 v3.121.2 教训再犯: UI/功能改动进 main 但未 bump+tag+发版 → 用户装旧版。
  # - main push: 若 src 版本 ≤ latest release 版本 → WARN 告警 (不阻塞)
  # - tag push: 必须与 src 版本一致 (否则 FAIL)
  version-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Check version alignment with latest release
      run: |
        SRC_VER=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/core/__init__.py | head -1)
        echo "src version: $SRC_VER"
        IS_TAG=$([ "${{ github.ref }}" = refs/heads/main ] && echo "main" || echo "tag:${GITHUB_REF#refs/tags/}")
        echo "push type: $IS_TAG"

        if [ "${{ github.ref }}" = refs/heads/main ]; then
          # main push: 对比 latest release
          LATEST=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' || echo "none")
          echo "latest release: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "✅ 无历史 release (首次发版前), 通过"
          elif python3 -c "import sys; a=tuple(map(int,'$SRC_VER'.split('.'))); b=tuple(map(int,'${LATEST#v}'.split('.'))); sys.exit(0 if a>b else 1)"; then
            echo "✅ main 版本 ($SRC_VER) > latest release ($LATEST) — 已 bump, 合规"
          else
            echo "⚠️ WARN: main 版本 ($SRC_VER) ≤ latest release ($LATEST) — 代码改动需 bump 版本并打 tag 发版 (v3.121.2 教训)" >&2
            echo "⚠️ 若本次 push 无代码改动 (仅文档/CI), 可忽略"
          fi
        else
          # tag push: 版本必须一致
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag: $TAG, src: $SRC_VER"
          if [ "$TAG" = "v$SRC_VER" ]; then
            echo "✅ tag $TAG 与 src 版本一致"
          else
            echo "❌ FAIL: tag $TAG ≠ src 版本 v$SRC_VER — tag 必须匹配 src/core/__init__.py" >&2
            exit 1
          fi
        fi
