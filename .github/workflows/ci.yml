name: CI

on:
  push:
    branches: [main]
    tags: ['v*']  # 002codex: tag 构建不可达 = 发版无 CI 门禁 (v3.133.0 教训)
  pull_request:
    branches: [main]

jobs:
  release-publish:
    # v3.137.11 (002meshctx F-A P2 根修): 原 job 是**结构性死步骤** —
    #   PATCH /releases/tags/${GITHUB_REF_NAME} 对 draft release **恒 404**
    #   (GitHub 语义: draft 不能用 tag 定位), 所以该步在 draft 状态下必然失败,
    #   且 poller 里 r["name"] != "CI" 会把整个 CI workflow 排除, 形成假绿灯盲区。
    # 现改为: **只做只读校验**, 不自动发布。发布由人按 release ID 显式执行
    #   (PATCH /releases/{id} {"draft": false}), 见 tools/publish_release.py。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, version-gate, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify all exact-SHA checks green (read-only, no publish)
        run: |
          pip install requests
          python3 - <<'EOF'
          import requests, sys, os, time
          tok = os.environ["GITHUB_TOKEN"]; sha = os.environ["C_SHA"]
          github_ref_name = os.environ.get("GITHUB_REF_NAME", "")
          self_id = int(os.environ["GITHUB_RUN_ID"])  # 只排除自身 run id (防自等待死锁)
          for i in range(60):  # 最多等 30 分钟
              runs = requests.get("https://api.github.com/repos/LucyAndLuna2023/meshctx/actions/runs",
                  params={"head_sha": sha, "per_page": 50},
                  headers={"Authorization": f"token {tok}"}).json().get("workflow_runs", [])
              # v3.137.11: 只排除自身 run id —— 不再按 name=="CI" 排除整个 workflow
              # (那样 tag CI 自身失败不进 red 判定 = 假绿; 同 SHA 双 run 互等已由
              #  checkout 的 concurrency + 只排除自身 id 解决)
              others = [r for r in runs if r["id"] != self_id and r.get("head_branch") == github_ref_name]
              active = [r for r in others if r["status"] != "completed"]
              # v3.137.12 (002meshctx B1): 红判定覆盖全部失败形态 —
              # cancelled/timed_out/startup_failure/action_required 与 failure 同罪;
              # 且要求五类 workflow (Build Linux/Windows/macOS/CI/i18n Guard) 全在列,
              # 防 "缺 i18n Guard 只剩 4 run 也 GREEN" 的覆盖盲区
              REQUIRED = {"Build Linux Package", "Build Windows Release", "Build macOS", "i18n Guard"}  # CI=self(排除自身后必然缺席, 不能列入 REQUIRED)
              names_present = {r["name"] for r in others}
              missing = REQUIRED - names_present
              # v3.137.13 (002codex B1): 只认 conclusion=="success" —
              # skipped/neutral/cancelled/timed_out 等一律视为失败形态 (假绿盲区根除)
              bad = [r for r in others if r["conclusion"] != "success"]
              # v3.137.16 (002codex: required workflow 晚创建需 settle window) —
              # 缺席不再立即红, 等待 (build 可能晚创建); 超时仍缺才 fail-closed
              if missing:
                  if i < 50:  # 前 50 轮 (~25min) 内继续等 (002codex B1: 引用循环变量, 勿用未定义名)
                      time.sleep(30)
                      continue
                  print(f"🔴 exact-SHA workflow 缺席 (等待超时): {sorted(missing)}"); sys.exit(1)
              # v3.137.15 补4 (002codex R4 时序竞态): 只对 completed run 判红 —
              # in_progress 的 run conclusion=None, 若在 active 检查前判 bad 会假红退出
              if not active and bad:
                  print(f"🔴 全部完成但有失败形态: {[(r['name'], r['conclusion']) for r in bad]}"); sys.exit(1)
              if len(others) >= 4 and not active and not bad:
                  print("🟢 全部 exact-SHA workflow success (只读校验, 不发布)"); break
              time.sleep(30)
          else:
              print("🔴 等待超时"); sys.exit(1)
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C_SHA: ${{ github.sha }}
      - name: Release gate (post-tag, fail-closed tag anchor)
        # v3.137.20 (002codex P4): --post-tag 接入 CI — tag^{commit} 锚 + body 校验自动化
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin tag "${GITHUB_REF_NAME}" --no-tags
          python tools/release_gate.py "${GITHUB_REF_NAME#v}" --post-tag

      - name: Remind manual publish by release ID
        run: |
          echo "ℹ 本 job **不发布**。发布由人按 release ID 执行:"
          echo "    python3 tools/publish_release.py --tag ${GITHUB_REF_NAME} --apply"
          echo "  (by-tag PATCH 对 draft 恒 404 — 必须按 release ID)"

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Release gate (pre-tag checks)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyyaml numpy requests python-multipart aiofiles jinja2 websockets cryptography
          pip install -e .[dev]
          VER=${GITHUB_REF_NAME#v}
          python tools/release_gate.py "$VER"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pyyaml numpy requests python-multipart aiofiles jinja2 websockets cryptography

    - name: Test with pytest (framework only, skip brain)
      run: |
        pip install -e .[dev]  # 002codex: 装齐实际依赖 (httpx/pytest-asyncio 等, 手工清单缺失致环境性红)
        set -o pipefail  # 002codex P1-B: 假绿根修 — pytest rc 被 tail 吞掉, broken code 进 main CI 仍 success
        pytest tests/ -v --tb=short -k "not brain and not super_brain and not healer and not predictor and not orchestrator and not free_energy and not active_inference" \
          --ignore=tests/ui/ --ignore=tests/run_e2e_test.py \
          -o 'addopts=' 2>&1 | tail -30

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t meshctx .

    - name: Test Docker image
      run: |
        docker run -d -p 3001:3001 --name meshctx-test meshctx
        sleep 10
        curl -fs http://localhost:3001/api/version
        docker stop meshctx-test

  # ═══ 发版流程固化 (2026-08-26 004meshctx, 002meshctx/004meshctx 审计建议) ═══
  # 防 v3.121.2 教训再犯: UI/功能改动进 main 但未 bump+tag+发版 → 用户装旧版。
  # - main push: 若 src 版本 ≤ latest release 版本 → WARN 告警 (不阻塞)
  # - tag push: 必须与 src 版本一致 (否则 FAIL)
  version-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Check version alignment with latest release
      run: |
        SRC_VER=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/core/__init__.py | head -1)
        echo "src version: $SRC_VER"
        IS_TAG=$([ "${{ github.ref }}" = refs/heads/main ] && echo "main" || echo "tag:${GITHUB_REF#refs/tags/}")
        echo "push type: $IS_TAG"

        if [ "${{ github.ref }}" = refs/heads/main ]; then
          # main push: 对比 latest release
          LATEST=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' || echo "none")
          echo "latest release: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "✅ 无历史 release (首次发版前), 通过"
          elif python3 -c "import sys; a=tuple(map(int,'$SRC_VER'.split('.'))); b=tuple(map(int,'${LATEST#v}'.split('.'))); sys.exit(0 if a>b else 1)"; then
            echo "✅ main 版本 ($SRC_VER) > latest release ($LATEST) — 已 bump, 合规"
          else
            echo "⚠️ WARN: main 版本 ($SRC_VER) ≤ latest release ($LATEST) — 代码改动需 bump 版本并打 tag 发版 (v3.121.2 教训)" >&2
            echo "⚠️ 若本次 push 无代码改动 (仅文档/CI), 可忽略"
          fi
        else
          # tag push: 版本必须一致
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag: $TAG, src: $SRC_VER"
          if [ "$TAG" = "v$SRC_VER" ]; then
            echo "✅ tag $TAG 与 src 版本一致"
          else
            echo "❌ FAIL: tag $TAG ≠ src 版本 v$SRC_VER — tag 必须匹配 src/core/__init__.py" >&2
            exit 1
          fi
        fi
