name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    # 双架构: macos-15 = arm64(Apple Silicon), macos-15-intel = x86_64(Intel)
    # 修复(2026-08-21): macos-13 已退役(队列永久 queued), macos-14 已弃用(2026-11-02 停用)
    # → 改用 macos-15 / macos-15-intel, Intel 资产命名保持 -intel 后缀
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset_suffix: ""
            expected_arch: "arm64"
          - runner: macos-15-intel
            asset_suffix: "-intel"
            expected_arch: "x86_64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pycryptodome pywebview

      - name: Install closed-source core (meshctx-core, optional)
        env:
          CORE_TOKEN: ${{ secrets.MESHCTX_CORE_TOKEN }}
        run: |
          if [ -n "${CORE_TOKEN}" ]; then
            echo "Bundling closed-source core (full product)"
            git clone --depth 1 "https://${CORE_TOKEN}@github.com/LucyAndLuna2023/meshctx-core.git" /tmp/meshctx-core >/dev/null 2>&1
            # 递归复制(保留子目录结构), 跳过顶层 __init__.py 保留开源 stub 路由
            (cd /tmp/meshctx-core/src/core && find . -name '*.py' ! -path './__init__.py' | tar -cf - -T -) | (cd src/core && tar -xf -)
            test -f src/core/desktop_tool.py && echo "OK: closed-source core bundled" || { echo "FAIL: core copy missing"; exit 1; }
          else
            echo "FAIL: MESHCTX_CORE_TOKEN secret 未配置 — 完整产品必须含闭源核心(护城河)，禁止发布 stub 资产"
            exit 1
          fi

      - name: Build macOS binary
        env:
          # 最低兼容 macOS 12 (Intel/Apple Silicon 用户均覆盖)
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          echo "==> 护城河: core 构建期从磁盘递归枚举显式 --hidden-import (杜绝 collect-submodules CI 静默失效)"
          CORE_IMPORTS=""
          CORE_COUNT=0
          while IFS= read -r f; do
            mod="${f#./}"; mod="${mod%.py}"; mod="${mod//\//.}"
            CORE_IMPORTS="$CORE_IMPORTS --hidden-import src.core.$mod"
            CORE_COUNT=$((CORE_COUNT+1))
          done < <(cd src/core && find . -name '*.py' ! -path './__init__.py' | sort)
          echo "enumerated core modules: $CORE_COUNT"
          if [ "$CORE_COUNT" -lt 100 ]; then echo "FAIL: 闭源核心未落地 (src/core 模块过少)"; exit 1; fi
          # 方案①(2026-08-21, 采纳 004 复核): 去掉 --onefile, 保留 --windowed
          # PyInstaller 在 macOS 上 --onefile 只输出单文件 UNIX executable, 不生成 .app bundle;
          # --windowed(默认 onedir) 生成 meshctx-desktop.app → DMG "拖入 Applications 即用" 才成立
          # --icon 对 .app bundle 生效 (对 --onefile 单文件无效)
          pyinstaller --windowed \
            --name meshctx-desktop \
            --icon logo.icns \
            --add-data "meshctx.yaml:." \
            --add-data "src/__init__.py:src" \
            --add-data "src/core/__init__.py:src/core" \
            --add-data "src/i18n_translations.json:src" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-submodules src \
            --hidden-import src \
            --hidden-import src.core \
            --hidden-import src.main \
            --hidden-import src.cli \
            --hidden-import yaml \
            --hidden-import openai \
            --hidden-import httpx \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import jinja2 \
            --hidden-import pydantic \
            --hidden-import aiohttp \
            --hidden-import webview \
            --hidden-import cryptography \
            --hidden-import cryptography.fernet \
            $CORE_IMPORTS \
            meshctx_desktop.py

      - name: Verify build
        run: |
          if [ -f dist/meshctx-desktop ]; then
            echo "OK: dist/meshctx-desktop"
            ls -lh dist/meshctx-desktop
          elif [ -d dist/meshctx-desktop.app ]; then
            echo "OK: .app bundle"
            ls -lh dist/meshctx-desktop.app/Contents/MacOS/meshctx-desktop
          else
            echo "FAIL: binary not found"
            find dist -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Verify architecture
        run: |
          BIN=dist/meshctx-desktop
          [ -d dist/meshctx-desktop.app ] && BIN=dist/meshctx-desktop.app/Contents/MacOS/meshctx-desktop
          file "$BIN" | tee /tmp/file_arch.txt
          grep -qE "${{ matrix.expected_arch }}" /tmp/file_arch.txt || { echo "FAIL: arch mismatch, expected ${{ matrix.expected_arch }}"; exit 1; }

      - name: Verify closed core in .app (禁止发布 stub)
        run: |
          BIN=dist/meshctx-desktop.app/Contents/MacOS/meshctx-desktop
          if pyi-archive_viewer -l "$BIN" 2>/dev/null | grep -q 'desktop_tool'; then
            echo "OK: .app 含闭源核心（PYZ 内 desktop_tool 已就位）"
          else
            echo "FAIL: .app 缺闭源核心模块 desktop_tool — 禁止发布 stub 资产"
            exit 1
          fi

      - name: Verify PYZ contains full closed core (.app, 禁止 stub)
        run: |
          TOC=build/meshctx-desktop/PYZ-00.toc
          test -f "$TOC" || { echo "FAIL: $TOC 不存在"; exit 1; }
          grep -q "src.core.desktop_tool" "$TOC" || { echo "FAIL: PYZ 缺 desktop_tool — 闭源核心未编译进包"; exit 1; }
          DISK_COUNT=$(cd src/core && find . -name '*.py' ! -path './__init__.py' | wc -l | tr -d ' ')
          TOC_COUNT=$(grep -oE "src\.core\.[A-Za-z0-9_\.]+" "$TOC" | sort -u | wc -l | tr -d ' ')
          echo "disk_modules=$DISK_COUNT pyz_modules=$TOC_COUNT"
          test "$TOC_COUNT" -ge "$DISK_COUNT" || { echo "FAIL: PYZ 模块数不足 ($TOC_COUNT < $DISK_COUNT) — STUB 降级包"; exit 1; }
          echo "OK: PYZ 含完整闭源核心 ($TOC_COUNT >= $DISK_COUNT)"

      - name: Build macOS CLI portable (完整版 CLI/服务, core 在字节码内)
        env:
          # 与 .app 一致: 最低兼容 macOS 12 (Intel/Apple Silicon 用户均覆盖)
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          echo "==> 护城河: core 构建期从磁盘递归枚举显式 --hidden-import (杜绝 collect-submodules CI 静默失效)"
          CORE_IMPORTS=""
          CORE_COUNT=0
          while IFS= read -r f; do
            mod="${f#./}"; mod="${mod%.py}"; mod="${mod//\//.}"
            CORE_IMPORTS="$CORE_IMPORTS --hidden-import src.core.$mod"
            CORE_COUNT=$((CORE_COUNT+1))
          done < <(cd src/core && find . -name '*.py' ! -path './__init__.py' | sort)
          echo "enumerated core modules: $CORE_COUNT"
          if [ "$CORE_COUNT" -lt 100 ]; then echo "FAIL: 闭源核心未落地 (src/core 模块过少)"; exit 1; fi
          pyinstaller --onedir \
            --name meshctx \
            --add-data "meshctx.yaml:." \
            --add-data "src/i18n_translations.json:src" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-submodules src \
            --hidden-import src \
            --hidden-import src.core \
            --hidden-import src.main \
            --hidden-import src.cli \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import jinja2 \
            --hidden-import pydantic \
            --hidden-import yaml \
            --hidden-import openai \
            --hidden-import httpx \
            --hidden-import cryptography \
            --hidden-import cryptography.fernet \
            $CORE_IMPORTS \
            src/cli.py
          test -x dist/meshctx/meshctx && echo "OK: dist/meshctx/meshctx" || { echo "FAIL: CLI binary missing"; exit 1; }

      - name: Verify PYZ contains full closed core (CLI, 禁止 stub)
        run: |
          TOC=build/meshctx/PYZ-00.toc
          test -f "$TOC" || { echo "FAIL: $TOC 不存在"; exit 1; }
          grep -q "src.core.desktop_tool" "$TOC" || { echo "FAIL: PYZ 缺 desktop_tool — 闭源核心未编译进包"; exit 1; }
          DISK_COUNT=$(cd src/core && find . -name '*.py' ! -path './__init__.py' | wc -l | tr -d ' ')
          TOC_COUNT=$(grep -oE "src\.core\.[A-Za-z0-9_\.]+" "$TOC" | sort -u | wc -l | tr -d ' ')
          echo "disk_modules=$DISK_COUNT pyz_modules=$TOC_COUNT"
          test "$TOC_COUNT" -ge "$DISK_COUNT" || { echo "FAIL: PYZ 模块数不足 ($TOC_COUNT < $DISK_COUNT) — STUB 降级包"; exit 1; }
          echo "OK: PYZ 含完整闭源核心 ($TOC_COUNT >= $DISK_COUNT)"

      - name: Verify closed core in CLI artifact (禁止发布 stub)
        run: |
          VHOME=$(mktemp -d)
          OUT=$(HOME="$VHOME" dist/meshctx/meshctx model add deepseek:chat --key sk-gate-verify 2>&1 || true)
          if echo "$OUT" | grep -q "STUB mode"; then
            echo "FAIL: CLI 封装资产为 stub（缺闭源核心）— 完整产品必须含闭源核心"
            echo "$OUT" | tail -5
            exit 1
          fi
          if ! grep -q "enc:" "$VHOME/.meshctx/config.yaml" 2>/dev/null; then
            echo "FAIL: 保存的 key 未加密（encrypt_key 不可用）— 闭源核心 crypto 缺失"
            exit 1
          fi
          echo "OK: CLI 封装资产含闭源核心（crypto 正常）"

      - name: Package CLI portable
        if: success()
        run: |
          cp README.md dist/
          tar -czf meshctx-macos-cli${{ matrix.asset_suffix }}.tar.gz -C dist meshctx README.md
          ls -lh meshctx-macos-cli${{ matrix.asset_suffix }}.tar.gz

      - name: Package as .tar.gz
        if: success()
        run: |
          if [ -d dist/meshctx-desktop.app ]; then
            cp -R dist/meshctx-desktop.app dist/meshctx.app
            cp README.md dist/
            tar -czf meshctx-macos${{ matrix.asset_suffix }}.tar.gz -C dist meshctx.app README.md
          elif [ -f dist/meshctx-desktop ]; then
            cp README.md dist/
            tar -czf meshctx-macos${{ matrix.asset_suffix }}.tar.gz -C dist meshctx-desktop README.md
          fi

      - name: Package as .dmg (主页 meshctx.com 下载链接)
        if: success()
        run: |
          if [ -f dist/meshctx-desktop ] || [ -d dist/meshctx-desktop.app ]; then
            mkdir -p dmgroot
            if [ -d dist/meshctx-desktop.app ]; then
              cp -R dist/meshctx-desktop.app dmgroot/meshctx.app
            else
              cp dist/meshctx-desktop dmgroot/meshctx
            fi
            ln -s /Applications dmgroot/Applications
            cp README.md dmgroot/
            hdiutil create -volname "meshctx" -srcfolder dmgroot -ov -format UDZO meshctx-macos${{ matrix.asset_suffix }}.dmg
            ls -lh meshctx-macos${{ matrix.asset_suffix }}.dmg
          else
            echo "FAIL: binary not found for dmg"
            exit 1
          fi

      - name: Upload Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: meshctx-macos${{ matrix.asset_suffix }}
          path: |
            meshctx-macos${{ matrix.asset_suffix }}.tar.gz
            meshctx-macos${{ matrix.asset_suffix }}.dmg
            meshctx-macos-cli${{ matrix.asset_suffix }}.tar.gz
          retention-days: 7

      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          update_release: true
          files: |
            meshctx-macos${{ matrix.asset_suffix }}.tar.gz
            meshctx-macos${{ matrix.asset_suffix }}.dmg
            meshctx-macos-cli${{ matrix.asset_suffix }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
