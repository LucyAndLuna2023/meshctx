name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'meshctx_desktop.py'
      - 'meshctx_desktop.spec'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pycryptodome pywebview
          brew install create-dmg || true

      - name: Build macOS binary
        run: |
          pyinstaller --onefile --windowed \
            --name meshctx-desktop \
            --add-data "meshctx.yaml:." \
            --add-data "src:src" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --hidden-import src \
            --hidden-import src.core \
            --hidden-import yaml \
            --hidden-import openai \
            --hidden-import httpx \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import jinja2 \
            --hidden-import pydantic \
            --hidden-import aiohttp \
            --hidden-import webview \
            meshctx_desktop.py

      - name: Verify build
        run: |
          if [ -f dist/meshctx-desktop ]; then
            echo "OK: dist/meshctx-desktop"
            ls -lh dist/meshctx-desktop
          elif [ -d dist/meshctx-desktop.app ]; then
            echo "OK: .app bundle"
            ls -lh dist/meshctx-desktop.app/Contents/MacOS/meshctx-desktop
          else
            echo "FAIL: binary not found"
            find dist -type f 2>/dev/null | head -20
            exit 1
          fi

      - name: Package as .tar.gz
        if: success()
        run: |
          if [ -f dist/meshctx-desktop ]; then
            cp README.md dist/
            tar -czf meshctx-macos.tar.gz -C dist meshctx-desktop README.md
          fi

      - name: Package as .dmg (主页 meshctx.com 下载链接)
        if: success()
        run: |
          if [ -f dist/meshctx-desktop ]; then
            mkdir -p dmgroot
            cp dist/meshctx-desktop dmgroot/meshctx
            cp README.md dmgroot/
            hdiutil create -volname "meshctx" -srcfolder dmgroot -ov -format UDZO meshctx-macos.dmg
            ls -lh meshctx-macos.dmg
          else
            echo "FAIL: binary not found for dmg"
            exit 1
          fi

      - name: Upload Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: meshctx-macos
          path: |
            meshctx-macos.tar.gz
            meshctx-macos.dmg
          retention-days: 7

      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meshctx-macos.tar.gz
            meshctx-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
