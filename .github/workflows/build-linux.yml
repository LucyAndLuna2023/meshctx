name: Build Linux Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dpkg-dev
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev

    - name: Build .deb
      run: |
        echo "==> 护城河策略: .deb 为源码包, 绝不注入闭源 core (明文 .py 会泄露核心代码)"
        echo "==> Linux 完整产品走 meshctx-portable.zip (PyInstaller 二进制封装, core 在字节码内)"
        bash packaging/deb/build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meshctx-deb
        path: meshctx_*_all.deb
        retention-days: 7

    - name: Generate checksums (SOP R5)
      run: |
        # 仅本 job 发布资产 .deb (勿哈希工作区 meshctx_desktop.py/nsi/spec/yaml 源码 → 杂散 sidecar)
        for f in meshctx_*_all.deb; do
          [ -f "$f" ] || continue
          [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256"
        done

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        update_release: true
        files: |
          meshctx_*_all.deb
          *.sha256

  build-portable:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller pycryptodome

    - name: Install closed-source core (meshctx-core, optional)
      env:
        CORE_TOKEN: ${{ secrets.MESHCTX_CORE_TOKEN }}
      run: |
        if [ -n "${CORE_TOKEN}" ]; then
          echo "Bundling closed-source core (full product)"
          git clone --depth 1 "https://${CORE_TOKEN}@github.com/LucyAndLuna2023/meshctx-core.git" /tmp/meshctx-core >/dev/null 2>&1
          # 修复(2026-08-24): 只叠加闭源独有模块 + 替换公开 stub; 公开真实实现(auth_v2 等)不被私有镜像覆盖
          bash scripts/overlay_core.sh /tmp/meshctx-core/src/core
        else
          echo "FAIL: MESHCTX_CORE_TOKEN secret 未配置 — 完整产品必须含闭源核心(护城河)，禁止发布 stub 资产"
          exit 1
        fi

    - name: Build Linux binary (PyInstaller)
      run: |
        echo "==> 护城河: core 构建期从磁盘递归枚举显式 --hidden-import (杜绝 collect-submodules CI 静默失效)"
        CORE_IMPORTS=""
        CORE_COUNT=0
        while IFS= read -r f; do
          mod="${f#./}"; mod="${mod%.py}"; mod="${mod//\//.}"
          CORE_IMPORTS="$CORE_IMPORTS --hidden-import src.core.$mod"
          CORE_COUNT=$((CORE_COUNT+1))
        done < <(cd src/core && find . -name '*.py' ! -path './__init__.py' | sort)
        echo "enumerated core modules: $CORE_COUNT"
        if [ "$CORE_COUNT" -lt 100 ]; then echo "FAIL: 闭源核心未落地 (src/core 模块过少)"; exit 1; fi
        pyinstaller --onedir \
          --name meshctx \
          --add-data "meshctx.yaml:." \
          --add-data "src/i18n_translations.json:src" \
          --add-data "templates:templates" \
          --add-data "static:static" \
          --collect-submodules src \
          --hidden-import src \
          --hidden-import src.core \
          --hidden-import src.main \
          --hidden-import src.cli \
          --hidden-import fastapi \
          --hidden-import uvicorn \
          --hidden-import jinja2 \
          --hidden-import pydantic \
          --hidden-import yaml \
          --hidden-import openai \
          --hidden-import httpx \
          --hidden-import cryptography \
          --hidden-import cryptography.fernet \
          $CORE_IMPORTS \
          src/cli.py
        ls -lh dist/

    - name: Verify PYZ contains full closed core (禁止 stub)
      run: |
        TOC=build/meshctx/PYZ-00.toc
        test -f "$TOC" || { echo "FAIL: $TOC 不存在"; exit 1; }
        grep -q "src.core.desktop_tool" "$TOC" || { echo "FAIL: PYZ 缺 desktop_tool — 闭源核心未编译进包"; exit 1; }
        DISK_COUNT=$(cd src/core && find . -name '*.py' ! -path './__init__.py' | wc -l | tr -d ' ')
        TOC_COUNT=$(grep -oE "src\.core\.[A-Za-z0-9_\.]+" "$TOC" | sort -u | wc -l | tr -d ' ')
        echo "disk_modules=$DISK_COUNT pyz_modules=$TOC_COUNT"
        test "$TOC_COUNT" -ge "$DISK_COUNT" || { echo "FAIL: PYZ 模块数不足 ($TOC_COUNT < $DISK_COUNT) — STUB 降级包"; exit 1; }
        echo "OK: PYZ 含完整闭源核心 ($TOC_COUNT >= $DISK_COUNT)"

    - name: Verify no plaintext core leaked
      run: |
        if find dist -path '*src/core*' -name '*.py' | grep -q .; then
          echo "FAIL: 明文 core .py 泄漏进包!"; find dist -path '*src/core*' -name '*.py' | head; exit 1
        fi
        echo "OK: 包内无明文 core 源码"

    - name: Verify closed core in artifact (禁止发布 stub)
      run: |
        VHOME=$(mktemp -d)
        OUT=$(HOME="$VHOME" dist/meshctx/meshctx model add deepseek:chat --key sk-gate-verify 2>&1 || true)
        if echo "$OUT" | grep -q "STUB mode"; then
          echo "FAIL: 封装资产为 stub（缺闭源核心）— 完整产品必须含闭源核心"
          echo "$OUT" | tail -5
          exit 1
        fi
        if ! grep -q "enc:" "$VHOME/.meshctx/config.yaml" 2>/dev/null; then
          echo "FAIL: 保存的 key 未加密（encrypt_key 不可用）— 闭源核心 crypto 缺失"
          exit 1
        fi
        echo "OK: 封装资产含闭源核心（crypto 正常）"

    - name: Package portable tar.gz
      run: |
        mkdir -p meshctx-linux
        cp -r dist/meshctx/* meshctx-linux/ 2>/dev/null || cp -r dist/meshctx meshctx-linux/ 2>/dev/null || { echo "dist/meshctx 不存在"; find dist -maxdepth 2 -type d; exit 1; }
        cp README.md meshctx-linux/ 2>/dev/null || true
        tar czf meshctx-linux.tar.gz meshctx-linux
        ls -lh meshctx-linux.tar.gz

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meshctx-linux-portable
        path: meshctx-linux.tar.gz
        retention-days: 7

    - name: Generate checksums (SOP R5)
      run: |
        # 仅本 job 发布资产 meshctx-linux.tar.gz (勿哈希工作区源码文件 → 杂散 sidecar)
        for f in meshctx-linux.tar.gz; do
          [ -f "$f" ] || continue
          [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256"
        done

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        update_release: true
        files: |
          meshctx-linux.tar.gz
          *.sha256
