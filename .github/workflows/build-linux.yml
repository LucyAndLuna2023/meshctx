name: Build Linux Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dpkg-dev
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev

    - name: Build .deb
      run: |
        echo "==> 护城河策略: .deb 为源码包, 绝不注入闭源 core (明文 .py 会泄露核心代码)"
        echo "==> Linux 完整产品走 meshctx-portable.zip (PyInstaller 二进制封装, core 在字节码内)"
        bash packaging/deb/build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meshctx-deb
        path: meshctx_*_all.deb
        retention-days: 7

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        update_release: true
        files: meshctx_*_all.deb

  build-portable:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller pycryptodome

    - name: Install closed-source core (meshctx-core, optional)
      env:
        CORE_TOKEN: ${{ secrets.MESHCTX_CORE_TOKEN }}
      run: |
        if [ -n "${CORE_TOKEN}" ]; then
          echo "Bundling closed-source core (full product)"
          git clone --depth 1 "https://${CORE_TOKEN}@github.com/LucyAndLuna2023/meshctx-core.git" /tmp/meshctx-core >/dev/null 2>&1
          (cd /tmp/meshctx-core/src/core && find . -name '*.py' ! -path './__init__.py' | tar -cf - -T -) | (cd src/core && tar -xf -)
          test -f src/core/desktop_tool.py && echo "OK: closed-source core bundled" || { echo "FAIL: core copy missing"; exit 1; }
        else
          echo "FAIL: MESHCTX_CORE_TOKEN secret 未配置 — 完整产品必须含闭源核心(护城河)，禁止发布 stub 资产"
          exit 1
        fi

    - name: Build Linux binary (PyInstaller)
      run: |
        echo "==> 护城河: core 仅经 --collect-submodules 编译为字节码, 不落明文 .py"
        pyinstaller --onedir \
          --name meshctx \
          --add-data "meshctx.yaml:." \
          --add-data "src/i18n_translations.json:src" \
          --add-data "templates:templates" \
          --add-data "static:static" \
          --collect-submodules src.core \
          --collect-submodules src \
          --hidden-import src \
          --hidden-import src.core \
          --hidden-import src.main \
          --hidden-import src.cli \
          --hidden-import fastapi \
          --hidden-import uvicorn \
          --hidden-import jinja2 \
          --hidden-import pydantic \
          --hidden-import yaml \
          --hidden-import openai \
          --hidden-import httpx \
          src/cli.py
        ls -lh dist/

    - name: Verify no plaintext core leaked
      run: |
        if find dist -path '*src/core*' -name '*.py' | grep -q .; then
          echo "FAIL: 明文 core .py 泄漏进包!"; find dist -path '*src/core*' -name '*.py' | head; exit 1
        fi
        echo "OK: 包内无明文 core 源码"

    - name: Verify closed core in artifact (禁止发布 stub)
      run: |
        VHOME=$(mktemp -d)
        OUT=$(HOME="$VHOME" dist/meshctx/meshctx model add deepseek:chat --key sk-gate-verify 2>&1 || true)
        if echo "$OUT" | grep -q "STUB mode"; then
          echo "FAIL: 封装资产为 stub（缺闭源核心）— 完整产品必须含闭源核心"
          echo "$OUT" | tail -5
          exit 1
        fi
        if ! grep -q "enc:" "$VHOME/.meshctx/config.yaml" 2>/dev/null; then
          echo "FAIL: 保存的 key 未加密（encrypt_key 不可用）— 闭源核心 crypto 缺失"
          exit 1
        fi
        echo "OK: 封装资产含闭源核心（crypto 正常）"

    - name: Package portable tar.gz
      run: |
        mkdir -p meshctx-linux
        cp -r dist/meshctx/* meshctx-linux/ 2>/dev/null || cp -r dist/meshctx meshctx-linux/ 2>/dev/null || { echo "dist/meshctx 不存在"; find dist -maxdepth 2 -type d; exit 1; }
        cp README.md meshctx-linux/ 2>/dev/null || true
        tar czf meshctx-linux.tar.gz meshctx-linux
        ls -lh meshctx-linux.tar.gz

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meshctx-linux-portable
        path: meshctx-linux.tar.gz
        retention-days: 7

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        update_release: true
        files: meshctx-linux.tar.gz
