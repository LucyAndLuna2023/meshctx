name: Build Linux Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dpkg-dev
      run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev

    - name: Build .deb
      run: |
        echo "==> 护城河策略: .deb 为源码包, 绝不注入闭源 core (明文 .py 会泄露核心代码)"
        echo "==> Linux 完整产品走 meshctx-portable.zip (PyInstaller 二进制封装, core 在字节码内)"
        bash packaging/deb/build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meshctx-deb
        path: meshctx_*_all.deb
        retention-days: 7

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        update_release: true
        files: meshctx_*_all.deb
