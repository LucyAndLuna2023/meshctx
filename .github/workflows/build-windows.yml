name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'meshctx_desktop.py'
      - 'meshctx_desktop.spec'
      - 'meshctx_setup.nsi'
      - 'version_info.txt'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pycryptodome pywebview

      - name: Install closed-source core (meshctx-core, optional)
        env:
          CORE_TOKEN: ${{ secrets.MESHCTX_CORE_TOKEN }}
        shell: pwsh
        run: |
          if ($env:CORE_TOKEN) {
            Write-Host "Bundling closed-source core (full product)"
            Write-Host "TEMP=[$env:TEMP] RUNNER_TEMP=[$env:RUNNER_TEMP]"
            $coreUrl = "https://$($env:CORE_TOKEN)@github.com/LucyAndLuna2023/meshctx-core.git"
            # 用 RUNNER_TEMP(GitHub Actions 保证存在), 不用 $env:TEMP(实测为空导致路径解析不一致)
            $coreDir = Join-Path $env:RUNNER_TEMP 'meshctx-core'
            git clone --depth 1 $coreUrl $coreDir *>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "WARN: core clone failed (exit $LASTEXITCODE), retrying once..."
              Remove-Item -Recurse -Force $coreDir -ErrorAction SilentlyContinue
              git clone --depth 1 $coreUrl $coreDir *>$null
              if ($LASTEXITCODE -ne 0) { Write-Host "FATAL: core clone failed again (exit $LASTEXITCODE)"; exit 1 }
            }
            # 修复(2026-08-24): 只叠加闭源独有模块 + 替换公开 stub; 公开真实实现(auth_v2 等)不被私有镜像覆盖
            $coreRoot = Join-Path $coreDir 'src\core'
            $srcFiles = Get-ChildItem $coreRoot -Recurse -Filter *.py
            Write-Host "core modules found: $($srcFiles.Count)"
            $added = 0; $replaced = 0; $kept = 0
            $srcFiles | ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($coreRoot, $_.FullName)
              if ($rel -eq '__init__.py') { return }
              $dest = Join-Path "src\core" $rel
              if (-not (Test-Path -LiteralPath $dest)) {
                New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $dest -Force
                $added++
              } else {
                $content = Get-Content -LiteralPath $dest -Raw -ErrorAction SilentlyContinue
                $isStub = $content.Contains('开源接口 stub') -or $content.Contains('_MeshCtxStubProxy') -or
                          $content.Contains('_StubProxy') -or $content.Contains('meshctx-core required (private repo)') -or
                          $content.Contains('meshctx-core (private) NOT installed')
                if ($isStub) {
                  Copy-Item -LiteralPath $_.FullName -Destination $dest -Force
                  $replaced++
                } else {
                  Write-Host "keep public(real): $rel"
                  $kept++
                }
              }
            }
            Write-Host "core overlay: added=$added replaced_stub=$replaced kept_public=$kept"
            # 门禁: 公开仓已修复的 auth_v2(回环信任) 必须保留
            $authV2 = Get-Content -LiteralPath "src\core\auth_v2.py" -Raw
            if ($authV2.Contains('_is_loopback_client')) {
              Write-Host "OK: public auth_v2 preserved (loopback trust)"
            } else {
              Write-Host "FAIL: auth_v2 被私有镜像覆盖, 回环信任丢失 — 禁止发布"
              exit 1
            }
            if (Test-Path "src\core\desktop_tool.py") { Write-Host "OK: closed-source core bundled" } else {
              Write-Host "FAIL: desktop_tool.py missing after copy"
              if (Test-Path $coreRoot) { Get-ChildItem $coreRoot | Select-Object -First 10 | ForEach-Object { Write-Host "  src: $($_.Name)" } }
              throw "core copy failed"
            }
          } else {
            Write-Host "FAIL: MESHCTX_CORE_TOKEN secret 未配置 — 完整产品必须含闭源核心(护城河)，禁止发布 stub 资产"
            exit 1
          }

      - name: Verify logo files
        run: |
          if (-not (Test-Path logo.ico)) {
            Write-Host "FATAL: logo.ico missing!"
            exit 1
          }
          if (-not (Test-Path logo.png)) {
            Write-Host "WARN: logo.png missing, copying from .ico"
            Copy-Item logo.ico logo.png
          }
          $icoSize = (Get-Item logo.ico).Length
          Write-Host "OK: logo.ico = $icoSize bytes"
          if ($icoSize -lt 1000) {
            Write-Host "FATAL: logo.ico too small — appears to be fake!"
            exit 1
          }

      - name: Build Desktop .exe
        run: pyinstaller meshctx_desktop.spec

      - name: Inject version info
        run: |
          python -m PyInstaller.utils.win32.versioninfo version_info.txt dist\meshctx-desktop.exe
          Write-Host "Version info injected"

      - name: Verify build
        run: |
          if (Test-Path dist\meshctx-desktop.exe) {
            Write-Host "OK: meshctx-desktop.exe"
            Get-Item dist\meshctx-desktop.exe | Select-Object Name, Length
          } else {
            Write-Host "FAIL: .exe not found"
            exit 1
          }

      - name: Verify exe size (防9B损坏)
        run: |
          $size = (Get-Item dist\meshctx-desktop.exe).Length
          if ($size -lt 1048576) {
            Write-Host "FATAL: exe too small ($size bytes) — build failed!"
            exit 1
          }
          Write-Host "OK: exe size = $size bytes ($([math]::Round($size/1MB,1)) MB)"

      - name: Verify closed core in exe (禁止发布 stub)
        run: |
          # -r 必须加: -l 只列 CArchive 顶层条目(PYZ.pyz), 不递归 PYZ 内部模块
          # 修复(2026-08-24, 002): 不加 -r 时完整包也 grep 不到 desktop_tool → 误报 stub
          # Out-String 必须加: PowerShell 捕获原生命令多行输出为数组,
          # 数组 -notmatch 逐元素返回"不匹配行"数组, if() 恒真 → 完整包也误报 stub
          $toc = pyi-archive_viewer -r -l dist\meshctx-desktop.exe | Out-String
          if ($toc -notmatch 'desktop_tool') {
            Write-Host "FAIL: .exe 缺闭源核心模块 desktop_tool — 禁止发布 stub 资产"
            exit 1
          }
          Write-Host "OK: .exe 含闭源核心（PYZ 内 desktop_tool 已就位）"

      - name: Verify PYZ contains full closed core (Desktop, 禁止 stub)
        run: |
          # workpath 默认取 spec 文件名: meshctx_desktop.spec → build\meshctx_desktop\
          # (macOS .app 是 CLI 参数构建 --name meshctx-desktop → build\meshctx-desktop, 两者不同)
          $tocFile = 'build\meshctx_desktop\PYZ-00.toc'
          if (-not (Test-Path $tocFile)) { Write-Host "FAIL: $tocFile 不存在"; exit 1 }
          $toc = Get-Content $tocFile -Raw
          if ($toc -notmatch 'src\.core\.desktop_tool') { Write-Host "FAIL: PYZ 缺 desktop_tool — 闭源核心未编译进包"; exit 1 }
          $diskCount = (Get-ChildItem src\core -Recurse -Filter *.py | Where-Object { $_.Name -ne '__init__.py' }).Count
          $tocCount = (($toc | Select-String -Pattern 'src\.core\.[A-Za-z0-9_\.]+' -AllMatches).Matches | ForEach-Object { $_.Value } | Sort-Object -Unique).Count
          Write-Host "disk_modules=$diskCount pyz_modules=$tocCount"
          if ($tocCount -lt $diskCount) { Write-Host "FAIL: PYZ 模块数不足 ($tocCount < $diskCount) — STUB 降级包"; exit 1 }
          Write-Host "OK: PYZ 含完整闭源核心 ($tocCount >= $diskCount)"

      - name: Build Windows CLI portable (完整版 CLI/服务, core 在字节码内)
        run: pyinstaller meshctx.spec --noconfirm

      - name: Verify PYZ contains full closed core (CLI, 禁止 stub)
        run: |
          $tocFile = 'build\meshctx\PYZ-00.toc'
          if (-not (Test-Path $tocFile)) { Write-Host "FAIL: $tocFile 不存在"; exit 1 }
          $toc = Get-Content $tocFile -Raw
          if ($toc -notmatch 'src\.core\.desktop_tool') { Write-Host "FAIL: PYZ 缺 desktop_tool — 闭源核心未编译进包"; exit 1 }
          $diskCount = (Get-ChildItem src\core -Recurse -Filter *.py | Where-Object { $_.Name -ne '__init__.py' }).Count
          $tocCount = (($toc | Select-String -Pattern 'src\.core\.[A-Za-z0-9_\.]+' -AllMatches).Matches | ForEach-Object { $_.Value } | Sort-Object -Unique).Count
          Write-Host "disk_modules=$diskCount pyz_modules=$tocCount"
          if ($tocCount -lt $diskCount) { Write-Host "FAIL: PYZ 模块数不足 ($tocCount < $diskCount) — STUB 降级包"; exit 1 }
          Write-Host "OK: PYZ 含完整闭源核心 ($tocCount >= $diskCount)"

      - name: Verify closed core in CLI artifact (禁止发布 stub)
        run: |
          $vhome = Join-Path $env:RUNNER_TEMP 'meshctx-cli-vhome'
          New-Item -ItemType Directory -Force -Path $vhome | Out-Null
          $prevUser = $env:USERPROFILE
          $env:USERPROFILE = $vhome
          try {
            $OUT = & 'dist\meshctx\meshctx.exe' model add deepseek:chat --key sk-gate-verify 2>&1 | Out-String
            # 探针命令本身非 0 退出 (保存 key 不校验 API); runner 的 pwsh 包装器以
            # $LASTEXITCODE 判定步骤成败 → 必须重置, 否则即使校验全过也报 exit 1
            $LASTEXITCODE = 0
          } finally {
            $env:USERPROFILE = $prevUser
          }
          if ($OUT -match 'STUB mode') {
            Write-Host "FAIL: CLI 封装资产为 stub（缺闭源核心）— 完整产品必须含闭源核心"
            Write-Host $OUT
            exit 1
          }
          $cfg = Join-Path $vhome '.meshctx\config.yaml'
          if (-not (Test-Path $cfg)) { Write-Host "FAIL: config.yaml 未生成"; exit 1 }
          if (-not (Select-String -Path $cfg -Pattern 'enc:' -Quiet)) {
            Write-Host "FAIL: 保存的 key 未加密（encrypt_key 不可用）— 闭源核心 crypto 缺失"
            exit 1
          }
          Write-Host "OK: CLI 封装资产含闭源核心（crypto 正常）"

      - name: Package CLI portable
        run: |
          copy README.md dist\
          Compress-Archive -Path dist\meshctx,dist\README.md -DestinationPath meshctx-windows-cli.zip -Force
          Get-Item meshctx-windows-cli.zip | Select-Object Name, Length

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" meshctx_setup.nsi
          if (Test-Path dist\meshctx-setup.exe) {
            Get-Item dist\meshctx-setup.exe | Select-Object Name, Length
          } else {
            Write-Host "WARN: NSIS build may have failed, continuing..."
          }

      - name: Package portable
        run: |
          copy dist\meshctx-desktop.exe dist\meshctx.exe
          copy README.md dist\
          Compress-Archive -Path dist\meshctx.exe,dist\README.md -DestinationPath meshctx-portable.zip

      - name: Upload Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: meshctx-windows
          path: |
            dist/meshctx.exe
            dist/meshctx-setup.exe
            meshctx-portable.zip
            meshctx-windows-cli.zip
          retention-days: 7

      - name: Generate checksums (SOP R5)
        shell: bash
        run: |
          # windows runner 默认 pwsh → 本步显式 bash; sidecar 一律扁平放根目录
          # (softprops 上传 glob *.sha256 只匹配顶层, dist/ 下 sidecar 不会被收集)
          for f in meshctx-portable.zip meshctx-windows-cli.zip; do
            [ -f "$f" ] || continue
            [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256"
          done
          for f in dist/meshctx.exe dist/meshctx-setup.exe; do
            [ -f "$f" ] || continue
            n="$(basename "$f")"
            [ -f "$n.sha256" ] || { h="$(sha256sum "$f" | cut -d' ' -f1)"; printf '%s  %s\n' "$h" "$n" > "$n.sha256"; }
          done

      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          update_release: true
          fail_on_unmatched_files: false
          files: |
            dist/meshctx.exe
            dist/meshctx-setup.exe
            meshctx-portable.zip
            meshctx-windows-cli.zip
            *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
