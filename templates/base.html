<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}meshctx{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .lang-switch { position:fixed; top:10px; right:20px; z-index:1000; }
        .lang-switch select { background:#1a1a2e; color:#e0e0e0; border:1px solid #333; padding:4px 8px; border-radius:4px; font-size:12px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="lang-switch">
        <select onchange="changeLang(this.value)" data-lang-key="lang_label" title="Language">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
        </select>
    </div>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="/ui/" class="nav-logo">🕸 meshctx</a>
            <span class="nav-version">v3.37</span>
        </div>
        <div class="nav-links">
            <a href="/ui/" class="nav-link" data-lang-key="nav_dashboard">仪表板</a>
            <a href="/ui/projects" class="nav-link" data-lang-key="nav_projects">项目</a>
            <a href="/ui/memories" class="nav-link" data-lang-key="nav_memories">记忆</a>
            <a href="/ui/continuity" class="nav-link" data-lang-key="nav_continuity">连续性</a>
            <a href="/docs" class="nav-link" target="_blank" data-lang-key="nav_api">API</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p data-lang-key="footer_text">meshctx — AI Agent 连续上下文记忆平台</p>
    </footer>

function changeLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.dataset.langKey;
        if (LANG[lang] && LANG[lang][key]) {
            el.textContent = LANG[lang][key];
        }
    });
    localStorage.setItem('meshctx-lang', lang);
}

// Restore saved language
const saved = localStorage.getItem('meshctx-lang') || 'en';
document.querySelector('.lang-switch select').value = saved;
changeLang(saved);
</script>
