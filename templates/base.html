<!DOCTYPE html>
<html lang="{{ __lang }}" dir="{{ 'rtl' if __lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}meshctx{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <style>
        .lang-switch { position:fixed; top:10px; right:20px; z-index:1000; }
        .lang-switch select { background:#1a1a2e; color:#e0e0e0; border:1px solid #333; padding:4px 8px; border-radius:4px; font-size:12px; cursor:pointer; }
        /* RTL overrides for Arabic */
        [dir="rtl"] .lang-switch { right:auto; left:20px; }
        [dir="rtl"] .nav-links { flex-direction:row-reverse; }
        [dir="rtl"] body { direction:rtl; text-align:right; }
        [dir="rtl"] .nav-logo { margin-right:0; margin-left:10px; }
    </style>
</head>
<body>
    <div class="lang-switch">
        <select onchange="changeLang(this.value)" data-lang-key="lang_label" title="Language">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="ar">🇸🇦 العربية</option>
        </select>
    </div>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="/ui/" class="nav-logo">🕸 meshctx</a>
            <span class="nav-version">v{{ version }}</span>
        </div>
        <div class="nav-links">
            <a href="/ui/" class="nav-link" data-lang-key="nav_dashboard">{{ t('nav_dashboard') }}</a>
            <a href="/ui/projects" class="nav-link" data-lang-key="nav_projects">{{ t('nav_projects') }}</a>
            <a href="/ui/memories" class="nav-link" data-lang-key="nav_memories">{{ t('nav_memories') }}</a>
            <a href="/ui/continuity" class="nav-link" data-lang-key="nav_continuity">{{ t('nav_continuity') }}</a>
            <a href="/docs" class="nav-link" target="_blank" data-lang-key="nav_api">{{ t('nav_api') }}</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p data-lang-key="footer_text">meshctx — AI Agent 连续上下文记忆平台</p>
    </footer>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
        return caches.keys();
    }).then(function(keys) {
        keys.forEach(function(k) { caches.delete(k); });
    }).catch(function() {});
}

function currentLang() {
    return document.documentElement.lang || 'en';
}

function changeLang(lang) {
    // Normalize: zh-CN→zh, en-US→en, ja-JP→ja (i18n keys are 2-char)
    lang = (lang || 'zh').split('-')[0];
    document.documentElement.lang = lang;
    // RTL support for Arabic
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    // Update all data-lang-key elements
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.dataset.langKey;
        if (LANG[lang] && LANG[lang][key]) {
            el.innerHTML = LANG[lang][key];
        }
    });
    // Update all data-lang-* templated elements
    document.querySelectorAll('[data-lang-count]').forEach(el => {
        const key = el.dataset.langCount;
        if (LANG[lang] && LANG[lang][key]) {
            const tpl = LANG[lang][key];
            el.textContent = tpl.replace('{count}', el.dataset.count || '0');
        }
    });
    // Sync dropdowns
    document.querySelectorAll('.lang-select').forEach(el => el.value = lang);
    // Persist to localStorage
    localStorage.setItem('meshctx_lang', lang);
    // Persist to cookie (synchronous, no race condition on refresh)
    document.cookie = 'meshctx_lang=' + lang + '; path=/; max-age=' + (365*24*3600) + '; SameSite=Lax';
    // Also sync to server (best-effort, for cookie.js same-origin validation)
    fetch('/api/lang/set', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:lang})}).catch(function(){})
}

// Restore language: server-rendered lang first, localStorage as fallback
var saved = document.documentElement.lang || localStorage.getItem('meshctx_lang') || 'zh';
// Auto-reset stale ja from old Accept-Language detection
if (saved === 'ja') { saved = 'zh'; localStorage.removeItem('meshctx_lang'); document.cookie = 'meshctx_lang=zh; path=/; max-age=' + (365*24*3600) + '; SameSite=Lax'; }
const dropdown = document.querySelector('.lang-select');
if (dropdown) dropdown.value = saved;
changeLang(saved);
</script>
