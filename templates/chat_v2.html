<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {--bg: #0f172a; --text: #e2e8f0; --muted: #94a3b8; --surface: #1e293b; --border: #334155; --accent: #6c5ce7; --hover: #1a2332;}
        * {margin:0; padding:0; box-sizing:border-box;}
        body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;}
        .topbar {height: 48px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;}
        .topbar .back {color: var(--muted); text-decoration: none; font-size: 18px;}
        .topbar .back:hover {color: var(--text);}
        .topbar .title {font-weight: 600; font-size: 14px; flex: 1;}
        .layout {display: flex; flex: 1; overflow: hidden;}
        .sidebar {width: 260px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0;}
        .sidebar.collapsed {width: 0; overflow: hidden;}
        .sidebar-header {padding: 12px 16px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;}
        .sidebar-header .count {font-size: 11px; color: var(--accent);}
        .sidebar-list {flex: 1; overflow-y: auto;}
        .sidebar-item {padding: 10px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .sidebar-item:hover {background: var(--hover);}
        .sidebar-item.active {background: rgba(108,92,231,0.12); border-left: 2px solid var(--accent);}
        .new-chat-btn {margin: 12px; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;}
        .new-chat-btn:hover {opacity: 0.9;}
        .toggle-sidebar {background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 8px;}
        .toggle-sidebar:hover {color: var(--text);}
        .chat-embed {flex: 1; border: none; width: 100%;}
        @media (max-width: 768px) {.sidebar {width: 0; position: absolute; z-index: 10; height: 100%;}.sidebar.mobile-open {width: 260px;}}
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/ui/v2" class="back">&larr;</a>
        <span class="title">&#128172; {{ t("chat") }}</span>
        <button class="toggle-sidebar" onclick="toggleSidebar()" title="History">&#128240; <span id="sidebarLabel">{{ t("v2_history") }}</span></button>
    </div>
    <div class="layout">
        <div class="sidebar" id="chatSidebar">
            <div class="sidebar-header">&#128240; <span id="historyTitle">{{ t("v2_history") }}</span> <span class="count" id="historyCount"></span></div>
            <button class="new-chat-btn" onclick="newChat()"><span id="newChatLabel">{{ t("v2_new_chat") }}</span></button>
            <div class="sidebar-list" id="historyList"><div style="padding:16px;color:var(--muted);" id="loadingLabel">{{ t("v2_loading") }}</div></div>
        </div>
        <iframe src="/ui/chat" class="chat-embed" id="chatFrame"></iframe>
    </div>
    <script>
        (function(){
            // ── i18n client-side support ──
            var I18N = JSON.parse(document.getElementById('i18n-data').textContent || '{}');
            var LANG = document.getElementById('lang-data').textContent || 'zh';
            window._t = function(k){ return (I18N[LANG]&&I18N[LANG][k]) || (I18N['en']&&I18N['en'][k]) || k; };

            function t(k){return window._t(k);}

            window.toggleSidebar = function(){
                var s = document.getElementById('chatSidebar');
                if(window.innerWidth <= 768){ s.classList.toggle('mobile-open'); }
                else { s.classList.toggle('collapsed'); }
            };

            window.newChat = function(){
                var fid = document.getElementById('chatFrame');
                localStorage.removeItem('meshctx_msgs');
                localStorage.removeItem('meshctx_conv_id');
                fid.src = '/ui/chat';
                setTimeout(function(){
                    try { fid.contentWindow.postMessage({type:'newChat'}, '*'); } catch(e){}
                    loadHistory();
                }, 500);
            };

            function loadHistory(){
                var list = document.getElementById('historyList');
                var count = document.getElementById('historyCount');
                fetch('/api/conversations')
                .then(function(r){ return r.json(); })
                .then(function(d){
                    var convs = (d.conversations || []).sort(function(a,b){
                        return (b.updated_at || b.created_at || 0) - (a.updated_at || a.created_at || 0);
                    });
                    count.textContent = convs.length;
                    if(!convs.length){
                        list.innerHTML = '<div style="padding:16px;color:var(--muted);">' + t('v2_no_history') + '</div>';
                        return;
                    }
                    list.innerHTML = convs.slice(0, 30).map(function(c){
                        var title = (c.title || 'Untitled').substring(0, 40).replace(/</g, '&lt;');
                        return '<div class="sidebar-item" data-id="' + c.id + '" onclick="openConv(\'' + c.id + '\')">' + title + '</div>';
                    }).join('');
                })
                .catch(function(e){
                    list.innerHTML = '<div style="padding:16px;color:var(--muted);">' + t('v2_load_failed') + '</div>';
                });
            }
            window.loadHistory = loadHistory;

            window.openConv = function(convId){
                var fid = document.getElementById('chatFrame');
                fetch('/api/conversations/' + convId)
                .then(function(r){ return r.json(); })
                .then(function(d){
                    if(d.messages){
                        localStorage.setItem('meshctx_msgs', JSON.stringify(d.messages));
                        localStorage.setItem('meshctx_conv_id', convId);
                    }
                    fid.src = '/ui/chat?conv=' + convId;
                    var items = document.querySelectorAll('.sidebar-item');
                    for(var i = 0; i < items.length; i++){ items[i].classList.remove('active'); }
                    var el = document.querySelector('.sidebar-item[data-id="' + convId + '"]');
                    if(el) el.classList.add('active');
                });
            };

            // Listen for save events from the iframe
            window.addEventListener('message', function(e){
                if(e.data && e.data.type === 'saveConv'){
                    fetch('/api/conversations', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id: e.data.id, title: e.data.title, model: e.data.model})
                    }).then(function(){ loadHistory(); });
                }
            });

            // Language change support
            window.updateLang = function(lang){
                try {
                    var el = document.getElementById('i18n-data');
                    var all = el ? JSON.parse(el.textContent || '{}') : {};
                    I18N = all;
                    LANG = lang;
                    // Update visible labels
                    var els = {
                        'sidebarLabel': 'v2_history', 'historyTitle': 'v2_history',
                        'newChatLabel': 'v2_new_chat', 'loadingLabel': 'v2_loading'
                    };
                    for(var id in els){
                        var lbl = document.getElementById(id);
                        if(lbl) lbl.textContent = t(els[id]);
                    }
                } catch(e) { console.error('updateLang error:', e); }
                loadHistory();
            };

            loadHistory();
            setInterval(loadHistory, 15000);
        })();
    </script>
    <script id="i18n-data" type="application/json">{{ __i18n_all_json | safe }}</script>
    <script id="lang-data" type="text/plain">{{ __lang }}</script>
</body>
</html>
