# MeshCtx docker-compose — One-command deploy
# docker-compose up -d
# 2026-08-25 004meshctx 审计修复:
#   - 端口 3000→3001 (产品统一端口)
#   - 卷挂载 /home/meshctx/.meshctx → /root/.meshctx (容器 HOME=/root, 原挂载点持久化失效)
#   - healthcheck /api/version → /health
version: '3.8'

services:
  meshctx:
    build: .
    container_name: meshctx
    ports:
      - "3001:3001"
    volumes:
      # Persistent data (conversations, config, keys) — 容器内 HOME=/root
      - meshctx_data:/root/.meshctx
    environment:
      # Model API keys — set in .env or export before running
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Auto-update (optional: docker-compose --profile auto-update up)
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 meshctx
    profiles:
      - auto-update

volumes:
  meshctx_data:

# ═══════════════════════════════════════════════
# Quick Start:
#   1. export DEEPSEEK_API_KEY=sk-xxx
#   2. docker-compose up -d
#   3. Open http://localhost:3001/ui/chat
#
# With optional auto-update:
#   docker-compose --profile auto-update up -d
# ═══════════════════════════════════════════════
